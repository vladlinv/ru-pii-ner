[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-pii-ner"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers>=4.56",
    "peft>=0.20",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ru_pii_ner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
